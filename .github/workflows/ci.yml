name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint + typecheck + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: bash scripts/typecheck.sh
      - name: Pytest
        run: pytest

  release-guard:
    name: Release hygiene (version bump + no [Unreleased])
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Every PR must bump plugin.yaml's `version` and file a dated CHANGELOG
      # entry — no `[Unreleased]`. On a PR we hand the guard the base-main
      # version so it can prove the bump happened.
      - name: Check release hygiene
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --depth=1 origin main
            RELEASE_BASE_VERSION="$(git show origin/main:plugin.yaml | sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')"
            export RELEASE_BASE_VERSION
            echo "Base (origin/main) version: $RELEASE_BASE_VERSION"
          fi
          node scripts/check-release.mjs
